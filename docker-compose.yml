services:
  shell:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: shell
    ports:
      - "3000:3000"
    command: node apps/shell/server.js
  account:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: account
    expose:
      - "3000"
    command: node apps/account/server.js
  contents:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: contents
    expose:
      - "3000"
    command: node apps/contents/server.js