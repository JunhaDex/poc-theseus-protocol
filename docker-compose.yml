services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: service
    ports:
      - "5432:5432"
    volumes:
      - database/data/postgres:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: db://user:password@db:5432/service
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: pnpm run dev
    depends_on:
      - db
  shell:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: shell
    ports:
      - "3000:3000"
    command: node apps/shell/server.js
    depends_on:
      - api
  account:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: account
    expose:
      - "3000"
    command: node apps/account/server.js
    depends_on:
      - api
  contents:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: contents
    expose:
      - "3000"
    command: node apps/contents/server.js
    depends_on:
      - api