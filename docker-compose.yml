services:
  shell:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: shell
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm turbo dev --filter=shell
  account:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: account
    expose:
      - "3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm turbo dev --filter=account
  contents:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_NAME: contents
    expose:
      - "3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm turbo dev --filter=contents